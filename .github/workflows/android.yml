name: Build Android OSMesa (FearLauncher)

on:
  [push, pull_request, workflow_dispatch]

jobs:
  build:
    strategy:
      matrix:
        arch: [ "aarch64" ]
      fail-fast: false

    name: "Build OSMesa+Panfrost for ${{ matrix.arch }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config \
            libxrandr-dev libxxf86vm-dev libxcb-*-dev libx11-xcb-dev \
            libxfixes-dev libdrm-dev libx11-dev python3-pip bison flex
          pip3 install --user mako packaging pyyaml

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Apply Android noafbc patch (Minecraft block textures)
        run: |
          set -e
          FILE=src/gallium/drivers/panfrost/pan_screen.c
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/gallium/drivers/panfrost/pan_screen.c")
          t = p.read_text()
          old = '''   /* Debug must be set first for pandecode to work correctly */
   dev->debug =
      debug_get_flags_option("PAN_MESA_DEBUG", panfrost_debug_options, 0);
   screen->max_afbc_packing_ratio = debug_get_num_option(
      "PAN_MAX_AFBC_PACKING_RATIO", DEFAULT_MAX_AFBC_PACKING_RATIO);'''
          new = '''   /* Debug must be set first for pandecode to work correctly */
   dev->debug =
      debug_get_flags_option("PAN_MESA_DEBUG", panfrost_debug_options, 0);
   /* FearLauncher: AFBC corrupts Minecraft block textures on Mali+kbase+OSMesa */
#if defined(__ANDROID__) || defined(ANDROID)
   if (!(dev->debug & PAN_DBG_NO_AFBC))
      dev->debug |= PAN_DBG_NO_AFBC;
#endif
   screen->max_afbc_packing_ratio = debug_get_num_option(
      "PAN_MAX_AFBC_PACKING_RATIO", DEFAULT_MAX_AFBC_PACKING_RATIO);'''
          if old not in t:
              raise SystemExit("patch context not found in pan_screen.c")
          p.write_text(t.replace(old, new, 1))
          print("patched pan_screen.c for Android noafbc default")
          PY

      - name: Build static libdrm + Mesa OSMesa
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          envsubst < android-drm-${{ matrix.arch }} > build-crossfile-drm
          git clone --depth 1 https://gitlab.freedesktop.org/mesa/drm.git
          cd drm
          meson setup build-android \
            --prefix=/tmp/drm-static \
            --cross-file ../build-crossfile-drm \
            -Ddefault_library=static \
            -Dintel=disabled -Dradeon=disabled -Damdgpu=disabled \
            -Dnouveau=disabled -Dvmwgfx=disabled -Dfreedreno=disabled \
            -Dvc4=disabled -Detnaviv=disabled
          ninja -C build-android install
          cd ..

          envsubst < android-${{ matrix.arch }} > build-crossfile
          meson setup build-android \
            --prefix=/tmp/pan \
            --cross-file build-crossfile \
            -Dplatforms=android \
            -Dplatform-sdk-version=26 \
            -Dandroid-stub=true \
            -Dllvm=disabled \
            -Dxlib-lease=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dglx=disabled \
            -Dopengl=true \
            -Dosmesa=true \
            -Dvulkan-drivers= \
            -Dgallium-drivers=swrast,panfrost \
            -Dshared-glapi=false \
            -Dbuildtype=release
          ninja -C build-android install
          find /tmp/pan -name '*.so*' | sort

      - name: Package for FearLauncher
        run: |
          set -e
          mkdir -p out/arm64-v8a
          find /tmp/pan -name 'libOSMesa*.so*' -exec cp -v {} out/arm64-v8a/ \;
          find /tmp/pan -name 'libgallium*.so*' -exec cp -v {} out/arm64-v8a/ \; 2>/dev/null || true
          cd out/arm64-v8a
          if [ -f libOSMesa.so.8 ]; then cp -v libOSMesa.so.8 libOSMesa_8.so
          elif [ -f libOSMesa.so ]; then cp -v libOSMesa.so libOSMesa_8.so
          fi
          ls -la
          cd ../..
          cat > out/README.txt << 'EOF'
          FearLauncher Mali Panfork package
          Copy libOSMesa_8.so into launcher jniLibs/arm64-v8a

          Env:
            LIB_MESA_NAME=libOSMesa_8.so
            GALLIUM_DRIVER=panfrost
            PAN_MESA_DEBUG=noafbc
          EOF
          (cd out && zip -r fear-launcher-panfork-osmesa-arm64.zip arm64-v8a README.txt)
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fear-launcher-panfork-osmesa-${{ matrix.arch }}
          path: out/fear-launcher-panfork-osmesa-arm64.zip
          if-no-files-found: warn
          retention-days: 30
