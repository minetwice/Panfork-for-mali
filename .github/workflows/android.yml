name: Build Android OSMesa

on:
  push:
    branches:
      - '24.0'
  pull_request:
    branches:
      - '24.0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OSMesa Panfrost aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config gettext-base python3-pip bison flex libdrm-dev
          pip3 install --user mako packaging pyyaml

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Apply Android noafbc patch
        run: bash scripts/apply-noafbc.sh

      - name: Build libdrm and Mesa OSMesa
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash scripts/build-android-osmesa.sh

      - name: Package for FearLauncher
        run: bash scripts/package-fearlauncher.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fear-launcher-panfork-osmesa-aarch64
          path: out/fear-launcher-panfork-osmesa-arm64.zip
          if-no-files-found: warn
          retention-days: 30
